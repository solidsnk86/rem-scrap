name: Weather pipeline

on:
  push:
    branches:
      - master

  schedule:
    # Recolección cada hora
    - cron: "5 * * * *"
      timezone: "America/Argentina/San_Luis"

    # Mail de predicción - 11:05 Argentina
    - cron: "5 11 * * *"
      timezone: "America/Argentina/San_Luis"

    # Mail resumen diario - 23:05 Argentina
    - cron: "5 23 * * *"
      timezone: "America/Argentina/San_Luis"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    env:
      GMAIL_USER_PASSWORD: ${{ secrets.GMAIL_USER_PASSWORD }}
      MAIL_CC: ${{ secrets.MAIL_CC }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      STUDIO_NEO_API_KEY: ${{ secrets.STUDIO_NEO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Recolectar datos
        if: |
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          github.event.schedule == '5 * * * *' ||
          github.event.schedule == '5 11 * * *' ||
          github.event.schedule == '5 23 * * *'
        run: pnpm run collect

      - name: Mail de predicción
        if: |
          github.event_name == 'schedule' &&
          github.event.schedule == '5 11 * * *'
        run: pnpm run email:prediction

      - name: Mail resumen diario
        if: |
          github.event_name == 'schedule' &&
          github.event.schedule == '5 23 * * *'
        run: pnpm run email:daily

      - name: Configure Git
        run: |
          git config user.name "solidsnk86"
          git config user.email "calcagni.gabriel86@gmail.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "🤖 [neoBot] Updated weather data"
            git push origin master
          else
            echo "No hay cambios para commitear"
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
