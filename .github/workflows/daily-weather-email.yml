name: Weather pipeline

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 * * * *'
    - cron: '0 14 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      GMAIL_USER_PASSWORD: ${{ secrets.GMAIL_USER_PASSWORD }}
      MAIL_CC: ${{ secrets.MAIL_CC }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      STUDIO_NEO_API_KEY: ${{ secrets.STUDIO_NEO_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Recolectar datos (cada hora)
        if: github.event_name != 'schedule' || github.event.schedule == '0 * * * *'
        run: pnpm run collect

      - name: Mail de predicción (11:00 Argentina)
        if: github.event_name == 'schedule' && github.event.schedule == '0 14 * * *'
        run: pnpm run email:prediction

      - name: Mail resumen diario (23:00 Argentina)
        if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * *'
        run: pnpm run email:daily

      - name: Configure Git
        run: |
          git config user.name "solidsnk86"
          git config user.email "calcagni.gabriel86@gmail.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖[neoBot] Updated README and sended emails with weather data location"
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}